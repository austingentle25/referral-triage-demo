  body{ background:var(--bg); color:var(--ink); }
  .header-btns a.notionlink, button.themebtn{
    flex-shrink:0; background:transparent; border:1px solid currentColor; color:inherit;
    padding:7px 10px; border-radius:7px; font-size:0.8125rem; cursor:pointer; line-height:1;
    opacity:.85; text-decoration:none; white-space:nowrap;
  }
  .header-btns a.notionlink:hover, button.themebtn:hover{ opacity:1; }

  :root{
    --bg:var(--k01b); --ink:var(--k02f); --ink-soft:var(--k03f);
    --panel:var(--k04b); --line:var(--k05b);
    --teal:var(--k06b); --teal-dark:var(--k07b);
    --picked:var(--k08f); --picked-bg:var(--k09b);
    --location:var(--k10f); --location-bg:var(--k11b);
    --review:var(--k12f); --review-bg:var(--k13b);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Roboto,"Roboto Regular","Helvetica Neue",Helvetica,Arial,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased; padding-bottom:48px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}
  header.top{
    position:sticky;top:0;z-index:20; background:var(--teal-dark); color:var(--k14f);
    padding:14px 16px 12px;
  }
  header.top .row{
    max-width:640px;margin:0 auto; display:flex;align-items:center;justify-content:space-between;
    gap:12px; flex-wrap:wrap; row-gap:8px;
  }
  /* The title is a name and must never break across lines. With the row allowed
     to wrap, the button group drops to its own line when space is tight instead
     of squeezing the title into two. */
  header.top h1{
    font-family:Roboto,"Roboto Regular","Helvetica Neue",Helvetica,Arial,sans-serif; font-size:1.125rem;
    margin:0; font-weight:600; letter-spacing:0.2px; white-space:nowrap;
  }
  /* The block is sized by the title, which never wraps, so centring the second
     line centres it under the title regardless of how long the name is. */
  header.top .sub{ font-size:0.75rem; color:var(--k15f); margin-top:2px; text-align:center; }
  button.startover{
    flex-shrink:0; background:transparent; border:1px solid var(--k16b); color:var(--k17f);
    padding:7px 12px; border-radius:7px; font-size:0.8125rem; cursor:pointer;
  }
  button.startover:hover{background:var(--k18b);}
  .header-btns{ display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .live-timer{
    font-variant-numeric:tabular-nums; font-size:0.8125rem; font-weight:700; color:var(--k19f);
    min-width:34px; text-align:right; letter-spacing:.2px;
  }
  button.pausebtn{
    flex-shrink:0; background:transparent; border:1px solid var(--k16b); color:var(--k17f);
    padding:7px 12px; border-radius:7px; font-size:0.8125rem; cursor:pointer;
  }
  button.pausebtn:hover{ background:var(--k18b); }
  button.pausebtn.is-paused{ background:var(--k20b); border-color:var(--k21b); color:var(--k22f); font-weight:700; }
  #stage.is-paused > .card{ opacity:0.35; pointer-events:none; user-select:none; }
  .paused-banner{
    background:var(--k20b); color:var(--k22f); font-weight:700; font-size:0.8125rem;
    padding:9px 12px; border-radius:9px; margin:0 0 12px; text-align:center;
  }

  .progress-wrap{
    max-width:640px; margin:10px auto 0; display:flex; align-items:center; gap:10px;
  }
  .progress-track{
    flex:1; height:6px; background:rgba(255,255,255,0.18); border-radius:999px; overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%; background:var(--k23b); border-radius:999px; transition:width .25s ease;
  }
  .progress-label{
    font-size:0.6875rem; color:var(--k15f); white-space:nowrap; flex-shrink:0;
  }

  .stage-badge{
    display:inline-block; margin:14px 0 10px; font-size:0.75rem; font-weight:700; letter-spacing:0.3px;
    color:var(--teal-dark-ink); background:var(--k24b); border:1px solid var(--k25b); padding:4px 10px; border-radius:999px;
  }

  .definition{
    margin:0 0 12px; background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--teal);
    border-radius:10px; padding:12px 16px;
  }
  .definition summary{ cursor:pointer; }
  .definition summary::-webkit-details-marker{ color:var(--teal-dark-ink); }
  .def-summary-row{ display:block; }
  .def-title{ font-size:0.8125rem; font-weight:700; color:var(--teal-dark-ink); }
  .def-oneliner{ display:block; font-size:0.7812rem; color:var(--ink-soft); margin-top:2px; font-weight:400; }
  .def-body{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .definition p.rule{ margin:0 0 8px; font-size:0.875rem; color:var(--ink); }
  .definition p.rule b{font-weight:700;}
  .definition ul{ margin:0 0 8px; padding-left:18px; font-size:0.8438rem; color:var(--ink-soft); }
  .definition ul li{margin-bottom:3px;}
  .definition dl{ margin:8px 0 0; font-size:0.8125rem; color:var(--ink-soft); border-top:1px solid var(--line); padding-top:8px; }
  .definition dl div{display:flex;gap:6px;margin-bottom:4px;}
  .definition dl dt{font-weight:700;color:var(--ink);flex:0 0 auto;}
  .definition dl dd{margin:0;}
  .definition .def-body details{ margin-top:8px; font-size:0.7812rem; color:var(--ink-soft); }
  .definition .def-body summary{ cursor:pointer; font-weight:700; color:var(--teal-dark-ink); }
  .definition .def-body details ul{ margin-top:6px; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px 18px; margin-bottom:14px; }

  .banner{
    background:var(--k11b); border:1px solid var(--k26b); color:var(--k27f); font-size:0.8125rem;
    padding:10px 14px; border-radius:10px; margin-bottom:14px;
  }
  .banner b{display:block;font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:3px;color:var(--k28f);}

  .context-badge{
    display:inline-block; font-size:0.6875rem; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    padding:5px 12px; border-radius:999px; margin-bottom:12px;
    background:var(--k29b); color:var(--k28f); border:1px solid var(--k30b);
  }
  .source-label{
    font-size:0.7812rem; color:var(--ink-soft); margin:8px 0 14px;
  }
  .source-label b{ color:var(--ink); font-weight:700; }
  .warning-label{
    font-size:0.7812rem; color:var(--k28f); background:var(--k29b); border:1px solid var(--k30b);
    border-radius:8px; padding:8px 11px; margin:8px 0 14px; font-weight:600; line-height:1.4;
  }
  .resume-box{
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
  }
  .resume-box summary{ font-size:0.8125rem; color:var(--teal-dark-ink); font-weight:600; cursor:pointer; }
  .resume-box .textarea-input{ margin-top:10px; font-size:0.8125rem; }
  .resume-btn{ margin-top:10px; }
  .resume-error{
    margin-top:8px; padding:8px 11px; background:var(--review-bg); color:var(--review);
    border-radius:8px; font-size:0.7812rem; font-weight:600;
  }
  .definition-label{
    font-size:0.7812rem; color:var(--teal-dark-ink); background:var(--k31b); border:1px solid var(--k32b);
    border-radius:8px; padding:8px 11px; margin:8px 0 14px; font-weight:500; line-height:1.4;
  }
  .toggle-row{ display:flex; gap:10px; margin-top:14px; }
  .toggle-row .edge-case-toggle{ margin-top:0; flex:1; }
  .edge-case-toggle{
    display:block; width:100%; margin:14px 0 0; padding:11px 14px;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    font-size:0.8438rem; color:var(--ink); cursor:pointer; text-align:center;
    font-family:inherit; transition:background .15s, border-color .15s, color .15s;
  }
  .edge-case-toggle:hover{ background:var(--k33b); }
  .edge-case-toggle.active{
    background:var(--teal-dark); border-color:var(--teal-dark-ink); color:var(--k34f); font-weight:700;
  }
  .checkpoint-card{
    background:var(--teal-dark); border-radius:14px; padding:16px 18px; margin-bottom:14px; color:var(--k34f);
  }
  .checkpoint-title{ font-size:0.6875rem; font-weight:700; text-transform:uppercase; letter-spacing:.4px; opacity:0.85; margin-bottom:10px; }
  .checkpoint-row{ display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:0.9062rem; }
  .cp-label{ opacity:0.8; }
  .cp-val{ font-weight:700; text-align:right; }
  .checkpoint-note{ margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.25); font-size:0.8125rem; font-weight:600; }

  .relevant-providers{
    background:var(--panel); border:1px solid var(--line); border-radius:11px;
    padding:12px 14px; margin:0 0 16px;
  }
  .relevant-providers-title{
    font-size:0.6875rem; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    color:var(--teal-dark-ink); margin-bottom:8px;
  }
  .relevant-provider-row{
    display:flex; flex-direction:column; padding:9px 6px; border-top:1px solid var(--line); gap:1px;
    width:100%; text-align:left; background:transparent; border-left:none; border-right:none; border-bottom:none;
    cursor:pointer; border-radius:6px; transition:background .12s;
  }
  .relevant-provider-row:first-of-type{ border-top:none; }
  .relevant-provider-row:hover{ background:var(--k35b); }
  .relevant-provider-row:active{ background:var(--k36b); }
  .rp-name{ font-size:0.8438rem; font-weight:700; color:var(--ink); }
  .rp-meta{ font-size:0.75rem; color:var(--ink-soft); }
  .relevant-provider-row.rp-blocked{ opacity:0.6; }
  .relevant-provider-row.rp-blocked .rp-meta{ color:var(--review); font-weight:600; }

  .question h2, .output-card h2, .stop-card h2, .done-card h2{
    font-family:Roboto,"Roboto Regular","Helvetica Neue",Helvetica,Arial,sans-serif; font-size:1.25rem; line-height:1.35;
    margin:0 0 4px; color:var(--ink); font-weight:600;
  }
  .question .step-label{ font-size:0.75rem; color:var(--teal-dark-ink); font-weight:700; margin-bottom:8px; display:block; }
  .btnrow{ display:flex;gap:10px; margin-top:20px; }
  .btn{
    flex:1; padding:16px 10px; font-size:1.0625rem; font-weight:700; border-radius:11px; border:none;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .btn.yes{background:var(--picked);color:var(--k34f);}
  .btn.yes:active{background:var(--k37b);}
  .btn.no{background:var(--review);color:var(--k34f);}
  .btn.no:active{background:var(--k38b);}
  .third-row{ margin-top:10px; text-align:center; }
  .btn.third{
    background:none; border:1px solid var(--location); color:var(--location);
    padding:9px 16px; border-radius:9px; font-size:0.8438rem; font-weight:700; cursor:pointer;
  }

  .input-row{ margin-top:18px; }
  .text-input{
    width:100%; padding:13px 12px; font-size:1rem; border:1px solid var(--line); border-radius:9px;
    font-family:inherit; color:var(--ink);
  }
  .text-input:focus{ outline:2px solid var(--teal); border-color:var(--teal-ink); }
  .textarea-input{ font-family:inherit; resize:vertical; line-height:1.4; }

  .prefixed-input{
    display:flex; align-items:stretch; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--k39b);
  }
  .prefixed-input:focus-within{ outline:2px solid var(--teal); border-color:var(--teal-ink); }
  .input-prefix{
    display:flex; align-items:center; padding:0 0 0 12px; font-size:1rem; font-weight:600;
    color:var(--ink-soft); white-space:nowrap; user-select:none;
  }
  .prefixed-input .text-input{ border:none; outline:none; padding-left:4px; }
  .prefixed-input .text-input:focus{ outline:none; border:none; }

  .dx-picker{ position:relative; }
  .dx-suggestions{
    display:none; position:relative; margin-top:6px; border:1px solid var(--line); border-radius:9px;
    background:var(--k39b); max-height:280px; overflow-y:auto; box-shadow:0 4px 14px rgba(0,0,0,0.06);
  }
  .dx-suggestion{
    padding:11px 12px; font-size:0.9062rem; color:var(--ink); cursor:pointer; border-bottom:1px solid var(--line);
    display:flex; flex-direction:column;
  }
  .dx-suggestion:last-child{ border-bottom:none; }
  .dx-suggestion:hover, .dx-suggestion:active{ background:var(--k40b); }
  .dx-suggestion-cat{ font-size:0.6875rem; color:var(--teal-dark-ink); margin-top:2px; font-weight:600; }
  .dx-suggestion-custom{ color:var(--ink-soft); font-style:italic; }
  .dx-suggestion-general{ color:var(--teal-dark-ink); font-style:italic; font-weight:600; }
  .dx-chips{ display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
  .dx-chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--picked-bg); border:1px solid var(--k41b);
    color:var(--picked); font-size:0.8438rem; font-weight:600; padding:6px 6px 6px 12px; border-radius:999px;
  }
  .dx-chip-x{
    background:none; border:none; color:var(--picked); font-size:1rem; line-height:1; cursor:pointer;
    padding:2px 6px; border-radius:999px;
  }
  .dx-chip-x:hover{ background:rgba(27,122,77,0.15); }
  select.text-input{ background:var(--k39b); appearance:auto; }
  .field-warn{ color:var(--review); font-size:0.75rem; margin-top:6px; display:none; }

  .form-fields{ display:flex; flex-direction:column; gap:18px; margin:14px 0 4px; }
  .form-field{ border-left:2px solid var(--line); padding-left:14px; }
  .form-q{ font-weight:600; margin-bottom:8px; line-height:1.4; }
  .form-opts{ display:flex; flex-wrap:wrap; gap:8px; }
  .form-opt{ padding:8px 14px; font-size:0.875rem; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); border-radius:6px; cursor:pointer;
    font-family:inherit; text-align:left; }
  .form-opt:hover{ border-color:var(--teal); }
  .form-opt.on{ background:var(--teal); border-color:var(--teal); color:var(--k14f); font-weight:600; }
  .form-text{ width:100%; }
  .form-hint{ font-size:0.75rem; color:var(--k03f); margin-top:8px; }
  .form-warn{ display:none; font-size:0.8125rem; color:var(--review); margin-top:8px; font-weight:600; }
  .btnrow-continue{ display:flex; gap:10px; margin-top:16px; }
  .continue-btn{
    flex:1; display:block; padding:15px; background:var(--teal-dark); border:none;
    border-radius:11px; color:var(--k34f); font-size:0.9688rem; font-weight:700; cursor:pointer;
  }
  .continue-btn:active{background:var(--k18b);}
  .back-btn{
    flex:0 0 auto; padding:15px 20px; background:var(--panel); border:1px solid var(--line);
    border-radius:11px; color:var(--ink); font-size:0.9375rem; font-weight:700; cursor:pointer;
  }

  function specialtiesForDiagnosis(dxText){
    var text = (dxText || "").toLowerCase();
    if (!text) return [];

    // Record every keyword hit with its span, then discard any hit that sits
    // entirely inside a longer hit. Without this, a generic keyword swallowed by
    // a more specific phrase drags in the wrong specialty - "pulmonary
    // hypertension" would match General via "hypertension", and "hypertrophic
    // cardiomyopathy" would match Interventional via "cardiomyopathy".
    // Containment is strict (longer only), so a term listed identically under
    // two specialties (e.g. "atrial fibrillation") still matches both.
    var hits = [];
    DIAGNOSIS_CATEGORIES.forEach(function(cat){
      cat.keywords.forEach(function(kw){
        var esc = kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        var re = (kw.length <= 4) ? new RegExp("\\b" + esc + "\\b", "gi") : new RegExp(esc, "gi");
        var m;
        while ((m = re.exec(text)) !== null){
          hits.push({ specialty:cat.specialty, start:m.index, end:m.index + m[0].length });
          if (m.index === re.lastIndex) re.lastIndex++;
        }
      });
    });

    var matched = [];
    hits.forEach(function(h){
      var swallowed = hits.some(function(o){
        return (o.end - o.start) > (h.end - h.start) && o.start <= h.start && o.end >= h.end;
      });
      if (swallowed) return;
      if (matched.indexOf(h.specialty) === -1) matched.push(h.specialty);
    });
    // Explicit specialty tag (added when staff picks "not listed" and assigns a
    // specialty manually, e.g. "Some rare condition [General]") overrides/supplements
    // keyword matching so unrecognized diagnoses can still drive auto-matching.
    DIAGNOSIS_CATEGORIES.forEach(function(cat){
      var tag = "[" + cat.specialty.toLowerCase() + "]";
      if (text.indexOf(tag) !== -1 && matched.indexOf(cat.specialty) === -1) matched.push(cat.specialty);
    });
    return matched;
  }

          return "p3_q1"; // no roster location data (custom-typed provider, or non-clinical staff) - ask manually
        }
        var deptShort = deptShortName(s.out.location);
        var matches = info.locations.some(function(loc){ return locMatches(loc, deptShort); });
        if (matches){
          setOut("agree","keep pair (auto-matched from provider list)");
          s.crumbs.push({ short:"Provider practices at that dept? (auto)", answer:"Yes" });
          return "p4_q1";
        }
        if (info.locations.length === 1){
          var only = canonicalDeptOption(info.locations[0]);
          setOut("location", only);
          setOut("agree","switched to " + only + " (auto - provider's only Biltmore location)");
          s.crumbs.push({ short:"Provider practices at that dept? (auto)", answer:"No - switched to " + only });
          return "p4_q1";
        }
        if (!s.out.location){
          s.crumbs.push({ short:"Provider practices at that dept? (auto)", answer:"No receiving location was ever captured - picking from provider's locations directly" });
          return "p3_pick_location_no_ref";
        }
        var hasCamelback = info.locations.some(function(loc){ return locMatches(loc, "Camelback"); });
        if (hasCamelback){
          s.crumbs.push({ short:"Provider practices at that dept? (auto)", answer:"No - checking usual location before defaulting" });
          return "p3_usual_location_ask";
        }
        s.crumbs.push({ short:"Provider practices at that dept? (auto)", answer:"No - no matching location, including Camelback" });
        return stopManual("Provider and location cannot be reconciled - " + (deptShortName(s.out.location) || "that department") + " is not one of their locations (provider list shows: " + info.locations.join(", ") + ").",3);

  // =========================================================
  // ENGINE
  // =========================================================
  function gotoResolve(id){
    while(true){
      if (id === "__STOP__" || id === "__DONE__"){ state.node = id; logCurrentRun(); render(); return; }
      var node = NODES[id];
      if (!node){ return; }
      if (node.kind === "auto"){ id = node.run(state); continue; }
      state.node = id;
      if (state.lastPart !== node.part){
        state.crumbs.push({ divider:true, text: PART_LABELS[node.part] });
        state.lastPart = node.part;
      }
      render();
      return;
    }
  }

  function recordStepTime(node){
    // The untimed opening step contributes nothing, so it is not logged at all
    // rather than logged as 0s, which would read as a real measurement.
    if (!stepStartTime) return;
    var now = Date.now();
    var pausedTotal = pausedMsForCurrentStep + ((isPaused && pauseStartedAt) ? (now - pauseStartedAt) : 0);
    var ms = Math.max(0, now - stepStartTime - pausedTotal);
    state.stepTimings.push({ short: node.short, ms: ms });
  }

  function answer(node, kind, label){
    historyStack.push(JSON.parse(JSON.stringify(state)));
    recordStepTime(node);
    state.crumbs.push({ short: node.short, answer: label });
    var next = node[kind](state);
    gotoResolve(next);
  }

  function submitText(node, value){
    historyStack.push(JSON.parse(JSON.stringify(state)));
    recordStepTime(node);
    state.out[node.field] = value;
    if (node.afterSubmit) node.afterSubmit(state);
    // An optional field left blank contributes nothing; recording it as an empty
    // answer just leaves "Mismatch detail:" trailing in the path.
    if (!(node.optional && !String(state.out[node.field] || "").trim())){
      state.crumbs.push({ short: node.short, answer: state.out[node.field] });
    }
    var next = (typeof node.next === "function") ? node.next(state) : node.next;
    gotoResolve(next);
  }

  function parseWhyPathText(text){
    var segments = String(text || "").split("→").map(function(s){ return s.trim(); }).filter(Boolean);
    if (!segments.length) return null;
    var parsed = [];
    for (var i = 0; i < segments.length; i++){
      var seg = segments[i];
      var idx = seg.indexOf(": ");
      if (idx === -1) return null;
      var short = seg.slice(0, idx);
      var ans = seg.slice(idx + 2);
      if (short.indexOf("(auto)") !== -1) continue; // regenerates on its own, not a real user step
      parsed.push({ short: short, answer: ans });
    }
    return parsed.length ? parsed : null;
  }

  function resumeFromWhyPathText(text, adopt){
    var parsed = parseWhyPathText(text);
    if (!parsed) return { ok:false, error:"Couldn't read that - paste the full \"Why this path\" text." };

    state = freshState();
    // Reopening an existing determination keeps that run's identity so it is
    // updated in the log rather than logged again alongside itself.
    if (adopt && adopt.runId){
      state.runId = adopt.runId;
      if (typeof adopt.seq === "number") state.runSeq = adopt.seq;
    }
    historyStack = [];
    isPaused = false; pauseStartedAt = null; pausedMsForCurrentStep = 0;

    for (var i = 0; i < parsed.length; i++){
      if (state.node === "__STOP__" || state.node === "__DONE__") break;
      var step = parsed[i];
      var node = NODES[state.node];
      if (!node) return { ok:false, error:"Stopped at step " + (i+1) + " (\"" + step.short + "\") - couldn't continue from there." };

      if (node.showRelevantProviders && / \(selected from list\)$/.test(step.answer)){
        var providerName = step.answer.replace(/ \(selected from list\)$/, "");
        historyStack.push(JSON.parse(JSON.stringify(state)));
        recordStepTime(node);
        setOut("provider", providerName);
        state.part1Result = "PROVIDER_PICKED";
        state.providerTreatsDx = true;
        state.crumbs.push({ short: node.short, answer: step.answer });
        gotoResolve("p3_entry");
        continue;
      }

      if (node.edgeCaseToggle && step.answer === "Edge case (skipped contracted question)"){
        historyStack.push(JSON.parse(JSON.stringify(state)));
        recordStepTime(node);
        setOut("contractedGrid","N/A - edge case (see type-specific check)");
        state.crumbs.push({ short: node.short, answer: step.answer });
        state._afterEdgeCase = "p4_referral_required";
        gotoResolve("p4_edge_case_type");
        continue;
      }
      if (node.selfPayToggle && step.answer === "Self-pay (skipped contracted question)"){
        historyStack.push(JSON.parse(JSON.stringify(state)));
        recordStepTime(node);
        setOut("contractedGrid","N/A - self-pay");
        setOut("insurancePath","self-pay - no insurance to bill, proceed accordingly");
        state.crumbs.push({ short: node.short, answer: step.answer });
        gotoResolve("p4_diag_entry");
        continue;
      }

      if (node.kind === "form"){
        // The form writes one crumb per field, except an optional field left
        // blank, which writes none. So resume matches on the field's label and
        // consumes a step only when the path actually carries one - counting
        // fields instead would run off the end of a form with blanks in it.
        historyStack.push(JSON.parse(JSON.stringify(state)));
        recordStepTime(node);
        var cursor = i;
        for (var fi = 0; fi < node.fields.length; fi++){
          var ff = node.fields[fi];
          var fstep = parsed[cursor];
          if (fstep && fstep.short === ff.short){
            if (!applyFormField(ff, fstep.answer)) return { ok:false, error:"Stopped at step " + (cursor+1) + " - couldn't match answer \"" + fstep.answer + "\" to \"" + ff.short + "\"." };
            cursor++;
          } else if (ff.kind === "text" && ff.optional){
            applyFormField(ff, "");
          } else {
            return { ok:false, error:"Stopped at step " + (cursor+1) + " - the path is missing \"" + ff.short + "\"." };
          }
        }
        i = cursor - 1;
        gotoResolve((typeof node.next === "function") ? node.next(state) : node.next);
        continue;
      }

      if (node.kind === "yesno" || node.kind === "yesno3"){
        var kind = null;
        if (step.answer === (node.yesLabel || "Yes")) kind = "yes";
        else if (step.answer === (node.noLabel || "No")) kind = "no";
        else if (node.kind === "yesno3" && step.answer === node.thirdLabel) kind = "third";
        if (!kind) return { ok:false, error:"Stopped at step " + (i+1) + " - couldn't match answer \"" + step.answer + "\" to \"" + step.short + "\"." };
        answer(node, kind, step.answer);
      } else if (node.kind === "text" || node.kind === "select" || node.kind === "diagnosis"){
        submitText(node, step.answer);
      } else {
        return { ok:false, error:"Stopped at step " + (i+1) + " - unexpected question type." };
      }
    }
    return { ok:true };
  }

  function goBack(){
    if (!historyStack.length) return;
    state = historyStack.pop();
    render();
  }

  function reset(){
    state = freshState();
    historyStack = [];
    isPaused = false;
    pauseStartedAt = null;
    pausedMsForCurrentStep = 0;
    viewMode = "flow";
    updatePauseUI();
    render();
  }

  function hasProgress(){
    return !!(state && (state.crumbs || []).length);
  }
  // The log lives in memory only, so it dies with the tab - and every time the
  // tool is redeployed, staff lose the list of what they have already worked.
  // Export writes it as JSON; import reads it back into a newer build.
  //
  // The envelope is versioned and import is deliberately forgiving: a log
  // exported from an older build is missing whatever fields were added since,
  // so every field is defaulted rather than assumed. That is the whole point -
  // the list has to survive the change that prompted the export.
  var LOG_FORMAT = "tpr-session-log";
  var logImportResult = null;
  var LOG_FORMAT_VERSION = 1;

  // A transferred log identifies its rows by Task ID, so the patient name does
  // not travel with it. The name is replaced rather than dropped: it is the
  // answer to the first step of the path, and Reopen replays that path, so
  // removing it outright would leave imported rows unable to reopen.
  //
  // There is no date-of-birth field in the tool - a DOB only ever appears
  // because it was typed into the name box, which this covers.
  var EXPORT_REDACTION = "(not exported)";

  function redactEntryForExport(e){
    var c = {};
    for (var k in e){ if (Object.prototype.hasOwnProperty.call(e, k)) c[k] = e[k]; }
    var name = String(e.patientName || "").trim();
    function scrub(t){
      t = String(t || "");
      // Keep whatever whitespace followed the value, or the crumb separator
      // loses its space and the path reads "(not exported)-> Task ID".
      t = t.replace(/(Patient name:\s*)([^\u2192\n]*)/g, function(m, p1, p2){
        return p1 + EXPORT_REDACTION + (/\s$/.test(p2) ? p2.match(/\s+$/)[0] : "");
      });
      t = t.replace(/(Patient:\s*)([^|\n]*)/g, function(m, p1, p2){
        return p1 + EXPORT_REDACTION + (/\s$/.test(p2) ? p2.match(/\s+$/)[0] : "");
      });
      // Whatever was typed as the name, wherever else it landed. split/join so a
      // name containing regex characters is still matched literally.
      if (name && name !== "(no name entered)") t = t.split(name).join(EXPORT_REDACTION);
      return t;
    }
    c.patientName = EXPORT_REDACTION;
    c.why = scrub(e.why);
    c.output = scrub(e.output);
    c.at = (e.at instanceof Date) ? e.at.toISOString() : String(e.at || "");
    return c;
  }

  function exportLogText(){
    return JSON.stringify({
      format: LOG_FORMAT,
      version: LOG_FORMAT_VERSION,
      exportedAt: new Date().toISOString(),
      entries: sessionLog.map(redactEntryForExport)
    }, null, 2);
  }

  // Returns {ok, added, updated, skipped, error}. Never throws on bad input:
  // a reviewer pasting the wrong thing should get a sentence, not a dead page.
  function importLogText(text){
    var data;
    try { data = JSON.parse(String(text || "")); }
    catch (err){ return { ok:false, error:"That is not a log export - paste the whole JSON block, including the outer braces." }; }
    if (!data || data.format !== LOG_FORMAT || !Array.isArray(data.entries)){
      return { ok:false, error:"That JSON is not a TPR session log export." };
    }
    if (typeof data.version === "number" && data.version > LOG_FORMAT_VERSION){
      return { ok:false, error:"That log was exported by a newer version of this tool (format " + data.version + "). Update this page first." };
    }
    var added = 0, updated = 0, skipped = 0;
    for (var i = 0; i < data.entries.length; i++){
      var raw = data.entries[i];
      if (!raw || typeof raw !== "object"){ skipped++; continue; }
      var when = raw.at ? new Date(raw.at) : null;
      if (!when || isNaN(when.getTime())) when = new Date();
      var entry = {
        runId: raw.runId || ("imported-" + i + "-" + when.getTime()),
        seq: 0,
        at: when,
        patientName: raw.patientName || "(no name entered)",
        taskId: raw.taskId || "",
        provider: raw.provider || "",
        location: raw.location || "",
        bucket: raw.bucket || "",
        urgent: raw.urgent === true,
        outcome: raw.outcome || "Exited early",
        schedulingStatus: raw.schedulingStatus || "",
        ms: typeof raw.ms === "number" ? raw.ms : 0,
        reviewerNote: raw.reviewerNote || "",
        pendingOn: Array.isArray(raw.pendingOn) ? raw.pendingOn : [],
        output: raw.output || "",
        why: raw.why || "",
        imported: true
      };
      var found = false;
      for (var j = 0; j < sessionLog.length; j++){
        if (sessionLog[j].runId === entry.runId){ sessionLog[j] = entry; updated++; found = true; break; }
      }
      if (!found){ sessionLog.push(entry); added++; }
    }
    // One ordering for imported and local entries alike, then renumber so the
    // list reads 1..n rather than carrying two clashing sets of numbers.
    sessionLog.sort(function(a, b){ return a.at - b.at; });
    for (var k = 0; k < sessionLog.length; k++){ sessionLog[k].seq = k + 1; }
    updateLogButton();
    return { ok:true, added:added, updated:updated, skipped:skipped };
  }

  // Records the current run, replacing any earlier entry for the same run so
  // that going Back and finishing again updates in place instead of duplicating.
  function logCurrentRun(outcomeOverride){
    if (!state || !state.runId) return;
    var o = state.out || {};
    var pendingOn = outstandingItems();
    var outcome = outcomeOverride || (state.node === "__STOP__" ? "Manual review"
                                    : state.node === "__DONE__" ? (pendingOn.length ? "Pending" : "Complete")
                                    : "Exited early");
    var entry = {
      runId: state.runId, seq: state.runSeq, at: new Date(),
      patientName: o.patientName || "(no name entered)",
      taskId: o.taskId || "", provider: o.provider || "",
      location: deptShortName(o.location) || "", bucket: o.bucket || "",
      urgent: o.urgent === "YES", outcome: outcome,
      schedulingStatus: computeSchedulingStatus(),
      ms: (state.stepTimings || []).reduce(function(sum, t){ return sum + t.ms; }, 0),
      reviewerNote: o.reviewerNote || "", pendingOn: pendingOn,
      output: buildOutputText(), why: buildWhyPath()
    };
    for (var i = 0; i < sessionLog.length; i++){
      if (sessionLog[i].runId === entry.runId){ sessionLog[i] = entry; updateLogButton(); return; }
    }
    sessionLog.push(entry);
    updateLogButton();
  }
  function exitCurrentRun(){
    if (hasProgress()) logCurrentRun(state.node === "__DONE__" ? null : (state.node === "__STOP__" ? null : "Exited early"));
    reset();
  }
  function updateLogButton(){
    var b = document.getElementById("logBtn");
    if (!b) return;
    b.textContent = "Log (" + sessionLog.length + ")";
    b.classList.toggle("has-entries", sessionLog.length > 0);
  }

  // Escapes quotes as well as tags: several call sites drop free-typed text
  // (patient name, diagnosis) into double-quoted attributes such as data-copy
  // and data-val, where a bare " would break out of the attribute.
  function escapeHtml(str){
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function bannerHtml(){
    if (!state.pendingBanner) return "";
    var html = '<div class="banner"><b>Why you\'re here</b>' + escapeHtml(state.pendingBanner) + '</div>';
    state.pendingBanner = null;
    return html;
  }
  function contextBadgeHtml(node){
    if (!node.context) return "";
    return '<div class="context-badge">' + escapeHtml(node.context) + '</div>';
  }
  function sourceLabelHtml(node){
    if (!node.source) return "";
    return '<div class="source-label">📍 Find this in: <b>' + escapeHtml(toTitleCase(node.source)) + '</b></div>';
  }
  function warningLabelHtml(node){
    if (!node.warning) return "";
    return '<div class="warning-label">⚠️ ' + escapeHtml(node.warning) + '</div>';
  }
  function resumeBoxHtml(node){
    if (!node.showResumeBox) return "";
    return '<details class="resume-box">' +
      '<summary>Have a saved path? Paste it here to resume where you left off.</summary>' +
      '<textarea id="resumeInput" class="text-input textarea-input" rows="4" placeholder="Paste the copied \u201cWhy this path\u201d text here…"></textarea>' +
      '<div class="resume-error" id="resumeError" style="display:none;"></div>' +
      '<button type="button" class="continue-btn resume-btn" id="resumeBtn">Resume from this path</button>' +
      '</details>';
  }
  function wireResumeBox(){
    var btn = document.getElementById("resumeBtn");
    if (!btn) return;
    btn.addEventListener("click", function(){
      var input = document.getElementById("resumeInput");
      var errEl = document.getElementById("resumeError");
      var result = resumeFromWhyPathText(input.value);
      if (!result.ok){
        errEl.textContent = result.error;
        errEl.style.display = "block";
        return;
      }
      render();
    });
  }
  function definitionLabelHtml(node){
    if (!node.definition) return "";
    return '<div class="definition-label">ℹ️ ' + escapeHtml(node.definition) + '</div>';
  }
  function checkpointHtml(node){
    if (!node.checkpoint) return "";
    var o = state.out;
    var deptName = deptShortName(o.location);
    var deptNum = deptNumberOnly(o.location);
    var sendingTo = deptName ? (deptName + (deptNum ? " (" + deptNum + ")" : "")) : " - ";
    return '<div class="checkpoint-card">' +
      '<div class="checkpoint-title">Provider &amp; Location Set</div>' +
      '<div class="checkpoint-row"><span class="cp-label">Provider</span><span class="cp-val">' + escapeHtml(o.provider || " - ") + '</span></div>' +
      '<div class="checkpoint-row"><span class="cp-label">Sending to</span><span class="cp-val">' + escapeHtml(sendingTo) + '</span></div>' +
      '<div class="checkpoint-note">Check insurance using the tool in Toolbox and in Athena (Quickview → Insurance), then continue below.</div>' +
      '</div>';
  }
  // Scheduling restrictions are read off the roster rather than matched by name
  // substring, so the flags and the displayed notes cannot drift apart. The two
  // restrictions are distinct: inClinicOnly providers ARE schedulable through
  // Valerie (biltmorecardsched, just no manual outreach), while
  // nonValerieScheduling providers are not (routed to sscardio).
  function providerFlag(name, flag){
    var p = PROVIDER_LOOKUP[name];
    return !!(p && p[flag]);
  }
  function providerIsInClinicOnly(name){ return providerFlag(name, "inClinicOnly"); }
  function providerIsNonValerie(name){ return providerFlag(name, "nonValerieScheduling"); }
  function isRestrictedProvider(name){
    return providerIsInClinicOnly(name) || providerIsNonValerie(name);
  }
  function restrictionLabel(name){
    if (providerIsNonValerie(name)) return " - not schedulable through Valerie";
    if (providerIsInClinicOnly(name)) return " - schedulable, but no manual outreach";
    return "";
  }
  function relevantProvidersListHtml(node){
    if (!node.showRelevantProviders) return "";
    var dxText = state.out.diagnosisText;
    var dxSpecs = specialtiesForDiagnosis(dxText);
    if (!dxSpecs.length) return "";
    var matches = PROVIDER_DATA.filter(function(p){
      return p.specialty && dxSpecs.some(function(sp){ return p.specialty.toLowerCase().indexOf(sp.toLowerCase()) !== -1; });
    });
    if (!matches.length) return "";
    matches = matches.slice().sort(function(a, b){
      function rank(p){
        if (isRestrictedProvider(p.name)) return 3;
        var deptShort = deptShortName(state.out.location);
        if (deptShort && p.locations.some(function(loc){ return locMatches(loc, deptShort); })) return 0;
        if (!deptShort && p.locations.some(function(loc){ return locMatches(loc, "Camelback"); })) return 0;
        return 1;
      }
      return rank(a) - rank(b);
    });
    var rows = matches.map(function(p){
      var loc = p.locations.length ? p.locations.join(", ") : "no location on file";
      var restricted = isRestrictedProvider(p.name);
      return '<button type="button" class="relevant-provider-row' + (restricted ? " rp-blocked" : "") + '" data-provider="' + escapeHtml(p.name) + '">' +
        '<span class="rp-name">' + escapeHtml(p.name) + '</span>' +
        '<span class="rp-meta">' + escapeHtml(p.specialty) + ' - ' + escapeHtml(loc) + escapeHtml(restrictionLabel(p.name)) + '</span>' +
        '</button>';
    }).join("");
    return '<div class="relevant-providers">' +
      '<div class="relevant-providers-title">Providers who treat ' + escapeHtml(dxText || "this diagnosis") + ' - tap to select</div>' +
      rows +
      '</div>';
  }
  function wireRelevantProvidersList(node){
    if (!node.showRelevantProviders) return;
    var rows = document.querySelectorAll(".relevant-provider-row");
    rows.forEach(function(row){
      row.addEventListener("click", function(){
        var name = row.getAttribute("data-provider");
        historyStack.push(JSON.parse(JSON.stringify(state)));
        recordStepTime(node);
        setOut("provider", name);
        state.part1Result = "PROVIDER_PICKED";
        state.providerTreatsDx = true;
        state.crumbs.push({ short: node.short, answer: name + " (selected from list)" });
        gotoResolve("p3_entry");
      });
    });
  }

  // ---- output text builder ----
  function f(val){
    if (val !== undefined && val !== null && val !== "") return val;
    return state.manualReview ? "STOP - manual review" : " - ";
  }
  // Sentence case, not title case. These values are authored deliberately -   // proper nouns are already capitalized ("Pre-Cert", "Athena Fax", "Wrong
  // type.") and the rest is meant to read as prose. Capitalizing every word
  // mangled them into "Deactivate Reason "Wrong Type.", Then Add-without-card
  // Flow", so only the first letter is raised and the rest is left as written.
  function toTitleCase(str){
    if (!str) return str;
    var s = String(str);
    var i = s.search(/[A-Za-z]/);
    if (i === -1) return s;
    return s.slice(0, i) + s.charAt(i).toUpperCase() + s.slice(i + 1);
  }
  function ft(val){ return toTitleCase(f(val)); }
  function buildVaInsuranceNote(){
    var end = new Date();
    end.setFullYear(end.getFullYear() + 1);
    var endStr = String(end.getMonth()+1).padStart(2,"0") + "/" + String(end.getDate()).padStart(2,"0") + "/" + end.getFullYear();
    return "VA - case policy Optum - VA Community Care Network + Veteran ICN + eligibility. Refer to the referral document first for the number of visits authorized; if not specified there, default to 12 visits, with the authorization window running one year from today's date (through " + endStr + ").";
  }
  function providerAthenaCode(){
    var p = state.out.provider;
    if (!p || p === "FIND LOCATION FIRST" || p === "MANUAL REVIEW") return "";
    return athenaProviderCode(p);
  }
  function providerSpecialty(){
    var p = state.out.provider;
    if (!p || p === "FIND LOCATION FIRST" || p === "MANUAL REVIEW") return "";
    var spec = effectiveSpecialty(p);
    return spec ? (PROVIDER_LOOKUP[p] && PROVIDER_LOOKUP[p].specialty ? spec : spec + " (confirmed this run)") : "";
  }
  // The ICD code and the [Specialty] tag are internal: the code identifies the
  // entry, the tag lets an unlisted diagnosis still match a provider. Neither
  // belongs in anything staff read out or paste into a chart.
  function cleanDiagnosisLabel(dx){
    return String(dx || "")
      .replace(/\s*\[[^\]]*\]\s*$/, "")
      .replace(/\s*\([^)]*\)\s*$/, "")
      .trim();
  }
  function buildUrgentReasonText(){
    var o = state.out;
    if (o.urgent !== "YES") return "";
    if (o.urgentReason === "diagnosis") return "Diagnosis: " + (cleanDiagnosisLabel(o.diagnosisText) || " - ");
    return "Per provider (fax marked Urgent)";
  }
  // Spec D4: the label Athena expects on the referral document itself. Established
  // and New are the same determination as the patient type, so it is derived, not asked.
  function buildDocumentLabel(){
    var st = state.out.status;
    if (!st) return "";
    return (st === "Established") ? "Established Patient Referral" : "New Patient Referral";
  }
  // The disposition vocabulary is fixed by the note spec. The tool's internal
  // action strings carry extra operational detail, so they are mapped rather than
  // printed. An empty result means the segment is omitted entirely, which the spec
  // requires for self-pay, ineligible insurance, awaiting phone and pending auth -
  // in each case another segment already carries the reason.
  function specDisposition(){
    var o = state.out;
    var a = (o.actionNote || "");
    var low = a.toLowerCase();
    if (state.manualReview) return "Additional Scheduling Information Required";
    if (state.awaitingInfo) return "Eligibility Pending";
    if (!a) return "";
    // The spec omits the disposition for these four: another segment already
    // states the reason, and a referral awaiting details is not "ready".
    if (low.indexOf("ineligible insurance") !== -1) return "";
    if ((o.contractedGrid || "").toLowerCase().indexOf("self-pay") !== -1) return "";
    if (o.phoneDisposition) return "";
    if ((o.authObjNote || "").toLowerCase().indexOf("pending") !== -1) return "";
    if (low.indexOf("non-valerie scheduling") !== -1) return "Non-Valerie Scheduling";
    if (low.indexOf("non-camelback referral") !== -1) return "Non Camelback Referral";
    if (low.indexOf("referring provider not in database") !== -1) return "Referring Provider Missing from Database";
    if (low.indexOf("ready to schedule") !== -1) return "Ready for Scheduling";
    if (low.indexOf("ineligible provider") !== -1) return "Insurance Not Accepted by Clinic/Receiving Provider";
    return "Additional Scheduling Information Required";
  }

  // Action Note: short, provider-free, routing reason only, hyphen-separated.
  // It is display guidance for the reviewer - nothing here writes to Athena.
  function buildActionNote(){
    var o = state.out;
    if (!o.status) return "";
    var rawDate = o.referralDate;
    if (!rawDate){
      var td = new Date();
      rawDate = String(td.getMonth()+1).padStart(2,"0") + "/" + String(td.getDate()).padStart(2,"0") + "/" + td.getFullYear();
    }
    var label = specDisposition();
    if (!label){
      if (o.phoneDisposition) label = "Awaiting Patient Phone Number";
      else if ((o.contractedGrid || "").toLowerCase().indexOf("self-pay") !== -1) label = "Self Pay";
      else if (o.contractedGrid === "No") label = "Insurance Network Review Required";
      else if ((o.authObjNote || "").toLowerCase().indexOf("pending") !== -1) label = "Referral Authorization Pending";
      else label = "Additional Scheduling Information Required";
    }
    return "Reviewed By Valerie Health (" + rawDate.replace(/\//g, ".") + ") - " + label;
  }

  // What the SOP treats as missing information: a blank yellow demographic field,
  // no home address, no phone number - plus the two states that leave a
  // determination waiting on somebody else, a pending authorization and an
  // unconfirmed payor. Any of these means the referral is not finished.
  function outstandingItems(){
    var o = state.out, out = [];
    if (o.phoneDisposition) out.push("Patient phone number");
    if ((o.addressNote || "").indexOf("Please Obtain") !== -1) out.push("Patient home address");
    if ((o.docLabelApplied || "").indexOf("no") === 0) out.push("Document label not applied");
    if (state.awaitingInfo) out.push("Payor eligibility unconfirmed");
    if ((o.authObjNote || "").toLowerCase().indexOf("pending") !== -1) out.push("Referral authorization pending");
    if (o.careTeamMismatch === "yes") out.push("Referring provider address");
    return out;
  }

  // Requested by the practice: the patient-facing note is hyphen-separated and
  // carries the receiving provider and the disposition only - not the urgency,
  // insurance or missing-information detail that the internal note collects.
  // The post-launch doc specified slashes; the practice uses "-".
  function buildPatientNote(){
    var o = state.out;
    if (!o.status) return "";
    var rawDate = o.referralDate;
    if (!rawDate){
      var td = new Date();
      rawDate = String(td.getMonth()+1).padStart(2,"0") + "/" + String(td.getDate()).padStart(2,"0") + "/" + td.getFullYear();
    }
    var provider = o.provider || "";
    if (provider === "FIND LOCATION FIRST" || provider === "MANUAL REVIEW") provider = "";
    if (!provider) provider = "N/A";
    var disp = specDisposition() || (state.manualReview ? "Additional Scheduling Information Required" : "Ready for Scheduling");
    return ["Reviewed By Valerie Health (" + rawDate.replace(/\//g, ".") + ")", provider, disp].join(" - ");
  }

  function buildInternalNote(){
    var o = state.out;
    if (!o.status) return "";
    // A manual-review stop never reaches Part 5, so referralDate is unset. Fall back
    // to today rather than emitting the literal placeholder "(DATE)".
    var rawDate = o.referralDate;
    if (!rawDate){
      var td = new Date();
      rawDate = String(td.getMonth()+1).padStart(2,"0") + "/" + String(td.getDate()).padStart(2,"0") + "/" + td.getFullYear();
    }
    var dateStr = rawDate.replace(/\//g, ".");
    var urgencyText = "";
    if (o.urgent === "YES"){
      if (o.urgentReason === "diagnosis"){
        // Strip both the ICD code in parentheses and the [Specialty] tag staff
        // add when a diagnosis is not on the list - neither belongs in a chart note.
        var dxLabel = cleanDiagnosisLabel(o.diagnosisText) || "diagnosis";
        urgencyText = "Urgent for " + dxLabel;
      } else {
        urgencyText = "Urgent Per Provider";
      }
    }
    // A manual-review stop can end before a provider is settled; the placeholder
    // values are internal, so say so plainly rather than emitting an empty segment.
    var providerShort = o.provider || "";
    if (providerShort === "FIND LOCATION FIRST" || providerShort === "MANUAL REVIEW") providerShort = "";
    if (!providerShort) providerShort = "N/A";
    // Drop the action segment when there is none (manual review) instead of
    // leaving a dangling "- -" in a note staff paste into Athena.
    var actionShort = shortActionNote(o.actionNote);
    // Notion's template, in its stated order:
    //   {date} - {provider} - {reason for sscardio} - {urgency} - {insurance}
    //   - {missing} - {auths}
    // Segments are omitted when they do not apply, which is why real notes run to
    // three or four rather than seven.
    var segs = ["Reviewed By Valerie Health (" + dateStr + ")", providerShort];

    var disp = specDisposition();
    if (disp) segs.push(disp);

    if (o.careTeamMismatch === "yes" && o.careTeamReferring) segs.push(o.careTeamReferring.replace(/\.$/, ""));

    if (urgencyText) segs.push(urgencyText);

    var ins = "";
    var path = (o.insurancePath || "").toLowerCase();
    if (o.contractedGrid === "No") ins = "Ineligible Insurance";
    else if (path.indexOf("self-pay") !== -1) ins = "Self-pay";
    else if (path.indexOf("va - case policy") !== -1 || path.indexOf("va community care") !== -1) ins = "VA";
    else if (path.indexOf("tribal") !== -1) ins = "Tribal Health";
    if (!ins && (o.insuranceVerifyFlag || "").indexOf("Awaiting Info") === 0) ins = "Awaiting Info - payor eligibility";
    if (ins) segs.push(ins);

    var missing = [];
    if (o.phoneDisposition) missing.push(o.phoneDisposition);
    if ((o.addressNote || "").indexOf("Please Obtain") !== -1) missing.push("Awaiting Patient Address");
    if (missing.length) segs.push(missing.join("; "));

    var auths = "";
    if ((o.outboundExport || "").indexOf("yes") === 0) auths = "Referral Authorization Requested";
    else if ((o.authObjNote || "").toLowerCase().indexOf("pending") !== -1) auths = "Auth Pending";
    if (auths) segs.push(auths);

    return segs.join(" - ");
  }
  // Action notes read as "Summary - detail clause", where the trailing clause
  // starts lowercase ("Ready to schedule - do not manually outreach"). Only that
  // clause is trimmed for the chart note. A separator joining two capitalised
  // halves ("Ineligible for Scheduling - Ineligible Insurance") and a free-typed
  // block reason are both kept whole, so no reason is silently dropped.
  function shortActionNote(note){
    var n = String(note || "-").trim();
    if (/^Blocked - /.test(n)) return n;
    return n.split(/\s-\s(?=[a-z])/)[0].trim();
  }
  function isInsuranceIneligible(){
    var o = state.out;
    return o.contractedGrid === "No" || (o.insurancePath && o.insurancePath.indexOf("not eligible") !== -1);
  }
  function buildInsuranceErrorNote(){
    var o = state.out;
    if (!isInsuranceIneligible()) return "";
    var reason = o.contractedGrid === "No"
      ? "Ineligible Insurance - plan not contracted with Biltmore"
      : "Insurance not eligible - " + (o.insurancePath || "see insurance path");
    return "Patient: " + (o.patientName || " - ") + " | Task ID: " + (o.taskId || " - ") + " | Issue: " + reason;
  }
  function buildEngineeringEscalationNote(){
    if (!state.needsEngineeringEscalation) return "";
    var o = state.out;
    var url = o.taskId ? "https://tpr.valeriehealth.com/tasks/" + o.taskId : " - ";
    var issue = (o.engineeringIssueCategory || "Insurance listed incorrectly in Athena") +
      (o.engineeringIssueDesc ? " - " + o.engineeringIssueDesc : "");
    issue += " (URL: " + url + ")";
    return "Message the Engineering team on Slack - " + (o.taskId || " - ") + ": " + (o.patientName || " - ") +
      " - " + issue + ". Could we please rerun? [Tag eng]";
  }
  function engineeringEscalationButtonHtml(){
    if (!state.needsEngineeringEscalation) return "";
    return '<button type="button" class="escalate-btn" id="escalateBtn" aria-label="Copy escalation note for Engineering">' +
      '<span class="escalate-label" id="escalateLabel">🛠 Escalate to Engineering - tap to copy note</span>' +
      '</button>';
  }
  function wireEngineeringEscalationButton(){
    var btn = document.getElementById("escalateBtn");
    if (!btn) return;

  function computeProgress(){
    if (state.node === "__DONE__" || state.node === "__STOP__") return 100;
    var node = NODES[state.node];
    if (!node) return 0;
    var part = node.part;
    var answered = 0;
    // Only count real questions. Auto-resolved steps also push a crumb, but
    // PART_INTERACTIVE counts interactive questions only, so including them
    // overstated progress - and each gate added to Part 5 made it worse.
    for (var i = state.crumbs.length - 1; i >= 0; i--){
      if (state.crumbs[i].divider) break;
      if (String(state.crumbs[i].short || "").indexOf("(auto)") !== -1) continue;
      answered++;
    }
    var total = PART_INTERACTIVE[part] || 1;
    var ratio = Math.min(1, answered / total);
    var pct = PART_START[part] + ratio * PART_WEIGHTS[part];
    return Math.max(0, Math.min(100, Math.round(pct)));
  }

  function updateProgress(){
    var pct = computeProgress();
    var fill = document.getElementById("progressFill");

    return "Engineering flag - " + task + "\n" +
           "URL: " + url + "\n" +
           "Patient: " + (o.patientName || "-") + "\n" +
           "Step: " + step + "\n" +
           "Issue: " + issue + "\n" +
           "Path: " + (buildWhyPathRedacted() || "(no answers yet)");
  }

  function wireFeedbackBox(node){
    var btn = document.getElementById("feedbackSubmit");

    btn.addEventListener("click", function(){

      if (!note){ if (input) input.focus(); return; }
      feedbackSeq++;
      feedbackLog.push({
        n: feedbackSeq,
        runId: state.runId,
        taskId: state.out.taskId || "(no task ID yet)",
        // Held only so it can be scrubbed out of what is sent. Never transmitted.
        patientName: state.out.patientName || "",
        nodeId: state.node,
        short: node.short || "(unlabelled)",
        // A multi-field screen's own text says nothing about which question was
        // meant, so the fields on screen are recorded with it.
        text: (node.text || "") + (node.kind === "form" && node.fields
          ? "\n  Questions on this screen: " + node.fields.map(function(f){ return f.label; }).join(" | ")
          : ""),
        part: node.partLabel || PART_LABELS[node.part] || ("Part " + node.part),
        path: buildWhyPathRedacted(),
        relayPath: buildWhyPathForRelay(),
        note: note,
        at: new Date()
      });
      var item = feedbackLog[feedbackLog.length - 1];
      updateFeedbackButton();
      if (input) input.value = "";
      btn.textContent = FEEDBACK_RELAY_URL ? "Sending\u2026" : "Added \u2713";
      sendFeedbackItem(item).then(function(){

  // Anything the relay has not accepted. With no relay configured everything is
  // "local", which is not a failure - it is the tool working as it did before.
  function unsentFeedback(){
    return feedbackLog.filter(function(f){ return f.sendState === "failed"; });

  function updateFeedbackButton(){
    var b = document.getElementById("feedbackBtn");
    if (!b) return;
    b.textContent = "Feedback (" + feedbackLog.length + ")";
    b.classList.toggle("has-entries", feedbackLog.length > 0);

  // Grouped by task so a reviewer can see every report against one referral
  // together, then read across referrals for a question that keeps recurring.
  function buildFeedbackReport(){
    if (!feedbackLog.length) return "";
    var byTask = {}, order = [];
    feedbackLog.forEach(function(f){
      if (!byTask[f.taskId]){ byTask[f.taskId] = []; order.push(f.taskId); }
      byTask[f.taskId].push(f);
    });
    var counts = {};
    feedbackLog.forEach(function(f){ counts[f.short] = (counts[f.short] || 0) + 1; });
    var repeats = Object.keys(counts).filter(function(k){ return counts[k] > 1; })
      .sort(function(a,b){ return counts[b] - counts[a]; });

    var L = [];
    L.push("REFERRAL SYNC HELPER - FEEDBACK REPORT");
    L.push("Generated " + new Date().toLocaleString());
    L.push(feedbackLog.length + " report" + (feedbackLog.length === 1 ? "" : "s") +
           " across " + order.length + " task" + (order.length === 1 ? "" : "s"));
    if (repeats.length){
      L.push("");
      L.push("QUESTIONS FLAGGED MORE THAN ONCE:");
      repeats.forEach(function(k){ L.push("  " + counts[k] + "x  " + k); });
    }
    order.forEach(function(t){
      L.push("");
      L.push("=".repeat(64));
      L.push("TASK: " + t);
      L.push("=".repeat(64));
      byTask[t].forEach(function(f){
        L.push("");
        L.push("[" + f.n + "] " + f.part + "  -  " + f.short + "   (node " + f.nodeId + ")");
        if (f.text) L.push("Screen text: " + f.text);
        L.push("Reported:    " + f.note);
        L.push("Logged at:   " + f.at.toLocaleTimeString());
        L.push("Path to here:");
        L.push("  " + (f.path || "(no answers yet)"));
      });
    });
    return L.join("\n");
  }

  function render(){
    updateStageBadge();
    updateProgress();
    updateHeaderSub();
    updateFooterNote();
    updateLiveTimer();
    updateLogButton();

    updateFeedbackButton();
    if (viewMode === "feedback"){ renderFeedback(); return; }
    if (viewMode === "log"){ renderLog(); return; }
    if (state.node === "__STOP__"){ renderStop(); return; }
    if (state.node === "__DONE__"){ renderDone(); return; }

    var node = NODES[state.node];
    if (!node) return;
    if (node.kind === "auto"){ /* no clock on silent steps */ }
    else if (state.node === TIMER_STARTS_AFTER){ stepStartTime = null; pausedMsForCurrentStep = 0; updateLiveTimer(); }
    else { stepStartTime = Date.now(); pausedMsForCurrentStep = 0; updateLiveTimer(); }
    if (node.kind === "form") renderFormNode(node);
    else if (node.kind === "text") renderTextNode(node);
    else if (node.kind === "select") renderSelectNode(node);
    else if (node.kind === "diagnosis") renderDiagnosisNode(node);
    else renderQuestionNode(node);
  }

  // A "form" node puts several questions from the SAME place in Athena on one
  // screen, so the reviewer looks there once instead of once per question. Only
  // collectors belong here - questions whose answer feeds the notes rather than
  // deciding what comes next. A field that branches the path must stay its own
  // node, or the branch would be taken before the reviewer had finished the page.
  //
  // Each field keeps the short label it had as a standalone question, and the
  // form pushes one crumb per field, so the "Why this path" text keeps exactly
  // the shape the log, the feedback reports and resume already expect.
  var formDraft = {};

  function formFieldAnswered(f){
    if (f.kind === "text") return f.optional || String(formDraft[f.short] || "").trim() !== "";
    return formDraft[f.short] !== undefined;
  }
  function formComplete(node){
    for (var i = 0; i < node.fields.length; i++){ if (!formFieldAnswered(node.fields[i])) return false; }
    return true;
  }

  // Applies one field's answer. Shared by the on-screen form and by resume, so
  // there is one definition of what an answer means rather than two.
  function applyFormField(f, label){
    if (f.kind === "text"){
      state.out[f.field] = label;
      if (f.afterSubmit) f.afterSubmit(state);
      if (!(f.optional && !String(label).trim())) state.crumbs.push({ short:f.short, answer:label });
      return true;
    }
    var kind = null;
    if (label === (f.yesLabel || "Yes")) kind = "yes";
    else if (label === (f.noLabel || "No")) kind = "no";
    else if (f.kind === "yesno3" && label === f.thirdLabel) kind = "third";
    if (!kind) return false;
    if (f[kind]) f[kind](state);
    state.crumbs.push({ short:f.short, answer:label });
    return true;
  }

  function submitForm(node){
    historyStack.push(JSON.parse(JSON.stringify(state)));
    recordStepTime(node);
    for (var i = 0; i < node.fields.length; i++){
      var f = node.fields[i];
      applyFormField(f, f.kind === "text" ? String(formDraft[f.short] || "") : formDraft[f.short]);
    }
    formDraft = {};
    var next = (typeof node.next === "function") ? node.next(state) : node.next;
    gotoResolve(next);
  }

  function renderFormNode(node){
    var blocks = "";
    for (var i = 0; i < node.fields.length; i++){
      var f = node.fields[i];
      var chosen = formDraft[f.short];
      var control;
      if (f.kind === "text"){
        control = '<input type="text" class="text-input form-text" data-fi="' + i + '"' +
          ' placeholder="' + escapeHtml(f.placeholder || "") + '"' +
          ' value="' + escapeHtml(chosen === undefined ? "" : chosen) + '" autocomplete="off">';
      } else {
        var opts = [ f.yesLabel || "Yes", f.noLabel || "No" ];
        if (f.kind === "yesno3") opts.push(f.thirdLabel);
        control = '<div class="form-opts">';
        for (var k = 0; k < opts.length; k++){
          control += '<button type="button" class="form-opt' + (chosen === opts[k] ? " on" : "") +
            '" data-fi="' + i + '" data-val="' + escapeHtml(opts[k]) + '">' + escapeHtml(opts[k]) + '</button>';
        }
        control += '</div>';
      }
      blocks += '<div class="form-field">' +
        '<div class="form-q">' + escapeHtml(f.label) + '</div>' +
        (f.warning ? '<div class="warning-label">' + escapeHtml(f.warning) + '</div>' : '') +
        (f.definition ? '<div class="definition-label">' + escapeHtml(f.definition) + '</div>' : '') +
        control +
      '</div>';
    }
    var ready = formComplete(node);
    var html = bannerHtml() + contextBadgeHtml(node) + checkpointHtml(node) +
      '<div class="card question">' +
        '<span class="step-label">Fill in</span>' +
        '<h2>' + escapeHtml(node.text) + '</h2>' +
        sourceLabelHtml(node) +
        warningLabelHtml(node) +
        definitionLabelHtml(node) +
        '<div class="form-fields">' + blocks + '</div>' +
        '<div class="btnrow-continue">' +
          backButtonHtml() +
          '<button class="continue" id="btnFormGo"' + (ready ? "" : " disabled") + '>Continue</button>' +
        '</div>' +
        '<div class="form-warn" id="formWarn"></div>' +
        '<div class="form-hint" id="formHint"' + (ready ? ' hidden' : '') + '>Answer every field to continue.</div>' +
      '</div>' +
      whyPathBoxHtml() + feedbackBoxHtml(node) + engFlagBoxHtml(node);
    stage.innerHTML = html;

    function refreshFormReady(){
      var go = document.getElementById("btnFormGo");
      var ready = formComplete(node);

  // Real calendar date, not just the right shape: rejects 13/01, 02/30 and
  // half-typed values by round-tripping through Date and comparing the parts.
  function isRealDate(str){
    var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(str).trim());
    if (!m) return false;
    var mm = +m[1], dd = +m[2], yyyy = +m[3];
    if (mm < 1 || mm > 12 || dd < 1 || yyyy < 1900 || yyyy > 2200) return false;
    var d = new Date(yyyy, mm - 1, dd);
    return d.getFullYear() === yyyy && d.getMonth() === mm - 1 && d.getDate() === dd;
  }
  function formatDateMask(value){
    var digits = value.replace(/\D/g, "").slice(0, 8);
    if (digits.length > 4) return digits.slice(0,2) + "/" + digits.slice(2,4) + "/" + digits.slice(4);
    if (digits.length > 2) return digits.slice(0,2) + "/" + digits.slice(2);
    return digits;
  }

  // Providers pick from a real searchable list only - no free-text escape hatch.
  // Typing filters; the answer is only ever set by clicking an actual match.
  function renderProviderSelectNode(node){
    var groups = node.dynamicGroups ? node.dynamicGroups(state) : node.groups;
    // A provider appears in the grouped dropdown once per location they practise
    // at, which is right for browsing but shows Cataldo three times when searching.
    // The label already lists every location, so the search list is de-duplicated.
    var flat = [];
    var seenProvider = {};
    (groups || []).forEach(function(g){
      g.options.forEach(function(opt){
        if (seenProvider[opt.value]) return;
        seenProvider[opt.value] = true;
        flat.push({ value:opt.value, label:opt.label, groupLabel:g.label,
                    inactive: !!(PROVIDER_LOOKUP[opt.value] && PROVIDER_LOOKUP[opt.value].inactive) });
      });
    });
    var selectedValue = null;

    var html = bannerHtml() + contextBadgeHtml(node) +
      '<div class="card question">' +
        '<span class="step-label">Select</span>' +
        '<h2>' + escapeHtml(node.text) + '</h2>' +
        sourceLabelHtml(node) +
        warningLabelHtml(node) +
        definitionLabelHtml(node) +
        '<div class="input-row dx-picker">' +
          '<input type="text" class="text-input" id="providerSearch" placeholder="Search providers…" autocomplete="off">' +
          '<div class="dx-suggestions" id="providerSuggestions"></div>' +
          '<div class="dx-chips" id="providerChips"></div>' +
          '<div class="field-warn" id="fieldWarn">Search and select a provider from the list to continue.</div>' +
        '</div>' +
        '<div class="btnrow-continue">' +
          backButtonHtml() +
          '<button class="continue-btn" id="submitBtn">Continue</button>' +
        '</div>' +
      '</div>' +
      whyPathBoxHtml() + feedbackBoxHtml(node) + engFlagBoxHtml(node);
    stage.innerHTML = html;

    var searchInput = document.getElementById("providerSearch");
    var suggestionsEl = document.getElementById("providerSuggestions");
    var chipsEl = document.getElementById("providerChips");
    searchInput.focus();

    function renderChip(){
      if (!selectedValue){ chipsEl.innerHTML = ""; return; }
      var match = flat.find(function(f){ return f.value === selectedValue; });
      chipsEl.innerHTML = '<span class="dx-chip">' + escapeHtml(match ? match.label : selectedValue) +
        ' <button type="button" class="dx-chip-x" id="providerClearBtn" aria-label="Clear">×</button></span>';
      var clearBtn = document.getElementById("providerClearBtn");
      if (clearBtn) clearBtn.addEventListener("click", function(){
        selectedValue = null;
        renderChip();
        searchInput.value = "";
        searchInput.style.display = "block";
        searchInput.focus();
        renderSuggestions();
      });
    }

    function renderSuggestions(){
      var q = searchInput.value.trim().toLowerCase();
      suggestionsEl.innerHTML = "";
      if (!q){ suggestionsEl.style.display = "none"; return; }
      // Athena codes and the roster do not always agree on spelling - AMG_STURM_D
      // against "Danielle Strum", for instance - so a search that finds nothing
      // falls back to matching regardless of letter order within each word.
      var matches = flat.filter(function(f){ return f.label.toLowerCase().indexOf(q) !== -1; });
      if (!matches.length && q.length >= 4){
        var sorted = q.split("").sort().join("");
        matches = flat.filter(function(f){
          return f.label.toLowerCase().split(/[^a-z]+/).some(function(w){
            return w.length >= 4 && w.split("").sort().join("") === sorted;
          });
        });
      }
      matches = matches.slice(0, 10);
      if (!matches.length){
        suggestionsEl.innerHTML = '<div class="dx-suggestion dx-suggestion-empty">No matching provider - try a different search.</div>';
        suggestionsEl.style.display = "block";
        return;
      }
      // Inactive providers are shown so a name on a referral can still be
      // recognised, but they carry no data-val, so nothing binds a click to them
      // and they cannot be chosen.
      suggestionsEl.innerHTML = matches.map(function(f){
        if (f.inactive){
          return '<div class="dx-suggestion dx-suggestion-inactive" aria-disabled="true">' +
            escapeHtml(f.label) + '<span class="inactive-tag">not active - do not select</span></div>';
        }
        return '<div class="dx-suggestion" data-val="' + escapeHtml(f.value) + '">' + escapeHtml(f.label) + '</div>';
      }).join("");
      suggestionsEl.style.display = "block";
      suggestionsEl.querySelectorAll(".dx-suggestion[data-val]").forEach(function(el){
        el.addEventListener("click", function(){
          selectedValue = el.getAttribute("data-val");
          renderChip();
          searchInput.value = "";
          suggestionsEl.innerHTML = "";
          suggestionsEl.style.display = "none";
          searchInput.style.display = "none";
          document.getElementById("fieldWarn").style.display = "none";
        });
      });
    }

    searchInput.addEventListener("input", renderSuggestions);

    document.getElementById("submitBtn").addEventListener("click", function(){
      if (!selectedValue){
        document.getElementById("fieldWarn").style.display = "block";
        return;
      }
      submitText(node, selectedValue);
    });
    wireBackButton();
    wireWhyPathBox();
    wireFeedbackBox(node);
    wireEngFlagBox(node);
  }

    function renderSuggestions(){

      var matches = CANONICAL_DIAGNOSES.filter(function(d){

      }).slice(0, 8);
      var exact = CANONICAL_DIAGNOSES.some(function(d){ return d.toLowerCase() === q; });
      var html2 = matches.map(function(d){
        var cats = specialtiesForDiagnosis(d).join(", ");
        return '<div class="dx-suggestion" data-val="' + escapeHtml(d) + '">' + escapeHtml(d) +
          (cats ? '<span class="dx-suggestion-cat">' + escapeHtml(cats) + '</span>' : '') + '</div>';
      }).join("");
      if (!exact && selected.indexOf(searchInput.value.trim()) === -1){

          }).join("");

      suggestionsEl.style.display = html2 ? "block" : "none";
      suggestionsEl.querySelectorAll(".dx-suggestion").forEach(function(el){
        el.addEventListener("click", function(){
          var val = el.getAttribute("data-val");
          if (val && selected.indexOf(val) === -1) selected.push(val);
          searchInput.value = "";
          renderChips();
          renderSuggestions();
          searchInput.focus();
        });
      });
    }

    searchInput.addEventListener("input", renderSuggestions);
    searchInput.addEventListener("keydown", function(e){
      if (e.key === "Enter"){

        return;

    }
    document.getElementById("submitBtn").addEventListener("click", doSubmit);
    wireBackButton();
    wireWhyPathBox();
    wireFeedbackBox(node);
    wireEngFlagBox(node);
  }

  }

  function renderDone(){
    var html = '<div class="card done-card">' +
      '<span class="tag">' + escapeHtml(state.out.taskId ? state.out.taskId + ' COMPLETE' : 'DETERMINATIONS COMPLETE') + '</span>' +
      '<h2>All set</h2>' +
      '<p>Update Athena wherever necessary using the output card below.</p>' +
      engineeringEscalationButtonHtml() +
      '<div class="btnrow-continue">' +
        backButtonHtml() +
        '<button class="again" id="nextPatientBtn">Next patient</button>' +
        '<button class="again" id="startOverBtn2">Start over</button>' +
      '</div>' +
      '</div>' +
      reviewerNoteHtml() +
      outputSectionHtml() +
      timeBreakdownHtml() +
      feedbackBoxHtml(OUTPUT_CARD_NODE) + engFlagBoxHtml(OUTPUT_CARD_NODE);
    stage.innerHTML = html;
    document.getElementById("startOverBtn2").addEventListener("click", reset);
    document.getElementById("nextPatientBtn").addEventListener("click", exitCurrentRun);
    wireEngineeringEscalationButton();
    wireBackButton();
    wireOutputSection();
    wireReviewerNote();
    wireFeedbackBox(OUTPUT_CARD_NODE);
    wireEngFlagBox(OUTPUT_CARD_NODE);
  }

  // ---- init ----
  stage = document.getElementById("stage");
  stageBadge = document.getElementById("stageBadge");
  document.getElementById("headerReset").addEventListener("click", reset);
  document.getElementById("pauseBtn").addEventListener("click", togglePause);
  document.getElementById("feedbackBtn").addEventListener("click", function(){ viewMode = (viewMode === "feedback") ? "flow" : "feedback"; render(); });

  // ---- theme toggle. Nothing is persisted, by design: this tool stores no state,
  // so the choice lasts for the tab and the system preference is the default. ----
  var themeBtn = document.getElementById("themeBtn");
  function currentTheme(){
    var explicit = document.documentElement.getAttribute("data-theme");
    if (explicit) return explicit;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    if (themeBtn) themeBtn.textContent = (t === "dark") ? "\u25d1" : "\u25d0";
  }
  if (themeBtn){
    applyTheme(currentTheme());
    themeBtn.addEventListener("click", function(){ applyTheme(currentTheme() === "dark" ? "light" : "dark"); });
  }

  document.getElementById("logBtn").addEventListener("click", function(){
    viewMode = (viewMode === "log") ? "flow" : "log";
    render();
  });
  setInterval(updateLiveTimer, 500);

  reset();
})();
</script>

</body>
</html>
