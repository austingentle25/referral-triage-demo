name = "referral-sync-feedback"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# The repository that receives the issues. Private, and created for this: its
# issues are not readable by anyone outside the account. Feedback is free text
# typed by staff working real referrals, so it does not go to a public tracker
# even though the tool's own repo is public. See DEPLOY.md.
GITHUB_REPO = "austingentle25/referral-sync-feedback"

# Only this origin may POST here. The deployed tool's origin, no trailing slash.
ALLOWED_ORIGIN = "https://austingentle25.github.io"

# GITHUB_TOKEN is deliberately absent. It is a secret, set once with
#   wrangler secret put GITHUB_TOKEN
# and must never appear in this file or any other committed file.
